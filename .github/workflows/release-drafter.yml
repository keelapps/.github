# Reusable workflow: keeps a draft release up to date and autolabels PRs
# from the shared config in this repo (.github/release-drafter.yml).
#
# Call it from a repo with:
#
#   jobs:
#     draft-release:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: keelapps/.github/.github/workflows/release-drafter.yml@main
#
# Trigger on `push` to the default branch (updates the draft) and on
# `pull_request_target` (autolabels PRs, fork PRs included — safe here
# because no PR code is checked out).
name: Release Drafter

on:
  workflow_call:

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Draft your next Release notes as Pull Requests are merged into the default branch
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: github:keelapps/.github:.github/release-drafter.yml
