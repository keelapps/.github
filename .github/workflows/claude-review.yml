name: Claude review (reusable)

# Reusable pull request review for every repo in the keelapps org.
#
# Call it from a repo with:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened]
#   jobs:
#     review:
#       uses: keelapps/.github/.github/workflows/claude-review.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#         id-token: write
#       secrets: inherit
#
# Everything else (what gets skipped, the review prompt, the action version)
# lives here, so one change updates the review in every repo.
#
# ── Required configuration ───────────────────────────────────────────────────
#   The Claude GitHub App installed on the org (https://github.com/apps/claude).
#   One of these secrets, per repo or org-wide:
#     secrets.CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token` (Claude subscription)
#     secrets.ANTHROPIC_API_KEY         from console.anthropic.com (billed per token)
#   Without either secret the job passes with a notice instead of failing, so a
#   repo can take this workflow before its secret exists.
#
# ── What is skipped ──────────────────────────────────────────────────────────
#   Draft PRs (reviewed when marked ready) and Dependabot PRs. Dependabot runs
#   don't receive Actions secrets anyway, and a version bump is what CI is for.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same PR cancels the review of the older one.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # The action trades the OIDC token for a Claude GitHub App token, so
      # comments are posted as claude[bot].
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no Claude credentials are configured
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Claude review skipped. Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to this repo's Actions secrets."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # Decided here, not by the model: on every push after the first review,
      # the model kept posting "No issues found." again.
      - name: Check whether Claude already reviewed this PR
        id: earlier
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length' \
            | awk '{ s += $1 } END { print s + 0 }') || count=0
          if [ "$count" -gt 0 ]; then echo "review=yes" >> "$GITHUB_OUTPUT"; else echo "review=no" >> "$GITHUB_OUTPUT"; fi

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        if: env.HAS_CREDENTIALS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_fix_links: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            EARLIER CLAUDE REVIEW: ${{ steps.earlier.outputs.review }}

            Review this pull request. The PR branch is checked out in the
            current working directory.

            1. Read the PR description, its comments and the diff:
               `gh pr view ${{ github.event.pull_request.number }} --comments`
               `gh pr diff ${{ github.event.pull_request.number }}`
               Your earlier inline comments are at
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
               Read CLAUDE.md and REVIEW.md in the repo if they exist and follow them.
               Open the surrounding files when the diff alone is not enough.

            2. If EARLIER CLAUDE REVIEW is "yes", review only what changed
               since then and never repeat a point already made.

            3. Report only problems worth fixing before merge:
               - bugs, regressions, wrong edge cases, broken error handling
               - security: secrets in code, injection, unsafe input handling.
                 In Forge apps, a resolver must check the caller's permission
                 itself and must not rely on module visibility.
               - behaviour the PR description claims but the code doesn't do
               - broken links, wrong facts or typos in user-facing text
               Skip style nits that a linter or formatter would catch, and skip
               anything you are not confident about.

            4. Post each problem as an inline comment on the exact line with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`. One or two plain sentences: what goes wrong,
               and the fix (a suggestion block when the fix is small).

            5. Top-level comment, with `gh pr comment`:
               - EARLIER CLAUDE REVIEW is "no": post exactly one, either
                 "No issues found." or "Found N issues, see inline comments."
               - EARLIER CLAUDE REVIEW is "yes": post "Found N new issues, see
                 inline comments." only if you posted new inline comments.
                 Otherwise post no top-level comment at all; never post
                 "No issues found." again.

            Never praise the change, restate the diff, add headings, emoji, a
            signature or any "Generated by" line. Only post GitHub comments;
            don't put review text in your final message.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
